name: nature-go

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../seed-service
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "node dist/db/migrate.js && exec node dist/serve.js"
      ]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HTTP_HOST: 127.0.0.1
      HTTP_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}
      MEDIA_STORAGE_LOCAL_DIR: /app/data/media
      AUDIO_TEMP_DIR: /app/data/audio-temp
      AUDIO_REFERENCE_DIR: /app/data/audio-reference
    volumes:
      - media-data:/app/data/media
      - audio-temp:/app/data/audio-temp
      - audio-reference:/app/data/audio-reference
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  media-data:
  audio-temp:
  audio-reference:
